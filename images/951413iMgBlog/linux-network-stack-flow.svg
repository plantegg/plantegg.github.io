<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080"
     font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif">

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9z" fill="#90A4AE"/>
    </marker>
    <filter id="ds" x="-2%" y="-2%" width="104%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000012"/>
    </filter>
  </defs>

  <style>
    .hw   { fill:#FFF3E0; stroke:#F57C00; stroke-width:1.5 }
    .irq  { fill:#FFF8E1; stroke:#FBC02D; stroke-width:1.5 }
    .kern { fill:#E3F2FD; stroke:#1976D2; stroke-width:1.5 }
    .proto{ fill:#E8F5E9; stroke:#388E3C; stroke-width:1.5 }
    .app  { fill:#F3E5F5; stroke:#7B1FA2; stroke-width:1.5 }
    .tap  { fill:#FFEBEE; stroke:#E53935; stroke-width:1.8; stroke-dasharray:6 3 }
    .nf   { fill:#FBE9E7; stroke:#E64A19; stroke-width:1.8 }
    .l1   { font-size:13px; font-weight:600; fill:#212121; text-anchor:middle }
    .l2   { font-size:10.5px; fill:#757575; text-anchor:middle }
    .arr  { stroke:#90A4AE; stroke-width:1.5; marker-end:url(#ah) }
    .note-box { fill:#FAFAFA; stroke:#B0BEC5; stroke-width:1; stroke-dasharray:5 3; rx:8; ry:8 }
  </style>

  <!-- ========== 背景 ========== -->
  <rect width="1500" height="1080" fill="#F7F8FA"/>

  <!-- ========== 标题 ========== -->
  <text x="750" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1A237E"
        >Linux 网络包收发流程全景图</text>
  <text x="750" y="68" text-anchor="middle" font-size="13" fill="#78909C"
        >基于 linux-network-stack.md · 含关键内核函数与可调参数</text>

  <!-- ========== 列标题 ========== -->
  <rect x="65" y="85" width="430" height="32" rx="6" fill="#E8EAF6" stroke="#C5CAE9" stroke-width="1"/>
  <text x="280" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#283593"
        >收包路径（网卡 → 应用）</text>

  <rect x="1005" y="85" width="430" height="32" rx="6" fill="#E8EAF6" stroke="#C5CAE9" stroke-width="1"/>
  <text x="1220" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#283593"
        >发包路径（应用 → 网卡）</text>

  <!-- ========== 中心分隔线 ========== -->
  <line x1="750" y1="88" x2="750" y2="960" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4 4"/>


  <!-- ================================================================ -->
  <!--                      收包路径 (RX)                                -->
  <!-- ================================================================ -->
  <g transform="translate(65,130)">

    <!-- ① 网卡接收 -->
    <rect class="hw" x="0" y="0" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="21">① 网卡接收数据帧</text>
    <text class="l2" x="215" y="40">MAC 校验 · promiscuous mode</text>
    <line class="arr" x1="215" y1="52" x2="215" y2="70"/>

    <!-- ② DMA → Ring Buffer -->
    <rect class="hw" x="0" y="70" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="91">② DMA → RX Ring Buffer</text>
    <text class="l2" x="215" y="110">ethtool -g/-G 调整 · overruns / rx_missed_errors</text>
    <line class="arr" x1="215" y1="122" x2="215" y2="140"/>

    <!-- ③ 硬中断 -->
    <rect class="hw" x="0" y="140" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="161">③ 硬中断通知 CPU</text>
    <text class="l2" x="215" y="180">IRQ affinity · ethtool -C 中断合并</text>
    <line class="arr" x1="215" y1="192" x2="215" y2="210"/>

    <!-- ④ 软中断 -->
    <rect class="irq" x="0" y="210" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="231">④ 触发 NET_RX_SOFTIRQ</text>
    <text class="l2" x="215" y="250">ksoftirqd/N 线程（per-CPU · 与硬中断同核）</text>
    <line class="arr" x1="215" y1="262" x2="215" y2="280"/>

    <!-- ⑤ NAPI poll -->
    <rect class="irq" x="0" y="280" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="301">⑤ NAPI poll 收包</text>
    <text class="l2" x="215" y="320">netdev_budget=300 · /proc/net/softnet_stat 第 3 列</text>
    <line class="arr" x1="215" y1="332" x2="215" y2="350"/>

    <!-- ⑥ GRO → netif_receive_skb -->
    <rect class="kern" x="0" y="350" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="371">⑥ GRO → netif_receive_skb</text>
    <text class="l2" x="215" y="390">合并小包 · 分配 sk_buff · 填充 metadata</text>
    <line class="arr" x1="215" y1="402" x2="215" y2="420"/>

    <!-- ⑦ tcpdump 抓包点 -->
    <rect class="tap" x="0" y="420" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="441">⑦ tcpdump 抓包点（TAP）</text>
    <text class="l2" x="215" y="460">在 netfilter 之前 — 被 DROP 的包仍可抓到</text>
    <line class="arr" x1="215" y1="472" x2="215" y2="490"/>

    <!-- ⑧ backlog 队列 -->
    <rect class="kern" x="0" y="490" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="511">⑧ netdev_max_backlog 队列</text>
    <text class="l2" x="215" y="530">默认 1000 · softnet_stat 第 2 列监控溢出</text>
    <line class="arr" x1="215" y1="542" x2="215" y2="560"/>

    <!-- ⑨ ip_rcv -->
    <rect class="proto" x="0" y="560" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="581">⑨ ip_rcv 网络层处理</text>
    <text class="l2" x="215" y="600">IP 包头校验 · 路由判断</text>
    <line class="arr" x1="215" y1="612" x2="215" y2="630"/>

    <!-- ⑩ netfilter -->
    <rect class="nf" x="0" y="630" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="651">⑩ netfilter / iptables</text>
    <text class="l2" x="215" y="670">PREROUTING · conntrack · 在软中断上下文执行</text>
    <line class="arr" x1="215" y1="682" x2="215" y2="700"/>

    <!-- ⑪ tcp_v4_rcv -->
    <rect class="proto" x="0" y="700" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="721">⑪ tcp_v4_rcv 传输层</text>
    <text class="l2" x="215" y="740">查找 socket · tcp_rmem · tcp_collapse 合并</text>
    <line class="arr" x1="215" y1="752" x2="215" y2="770"/>

    <!-- ⑫ 应用 read -->
    <rect class="app" x="0" y="770" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="791">⑫ 应用 read() / recv()</text>
    <text class="l2" x="215" y="810">sk_data_ready 唤醒进程</text>

  </g>


  <!-- ================================================================ -->
  <!--                      发包路径 (TX)                                -->
  <!-- ================================================================ -->
  <g transform="translate(1005,130)">

    <!-- ① 应用 write -->
    <rect class="app" x="0" y="0" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="21">① 应用 write() / sendmsg()</text>
    <text class="l2" x="215" y="40">用户态系统调用 → 进入内核</text>
    <line class="arr" x1="215" y1="52" x2="215" y2="70"/>

    <!-- ② sk_write_queue -->
    <rect class="proto" x="0" y="70" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="91">② 数据拷贝到 sk_write_queue</text>
    <text class="l2" x="215" y="110">tcp_wmem · SO_SNDBUF 控制缓冲大小</text>
    <line class="arr" x1="215" y1="122" x2="215" y2="140"/>

    <!-- ③ TCP 分片 -->
    <rect class="proto" x="0" y="140" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="161">③ TCP 分片 + tcp_transmit_skb</text>
    <text class="l2" x="215" y="180">构造 TCP 包头 · skb 克隆（dataref+1）</text>
    <line class="arr" x1="215" y1="192" x2="215" y2="210"/>

    <!-- ④ ip_queue_xmit -->
    <rect class="proto" x="0" y="210" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="231">④ ip_queue_xmit 网络层</text>
    <text class="l2" x="215" y="250">路由查找 · 构建 IP 包头</text>
    <line class="arr" x1="215" y1="262" x2="215" y2="280"/>

    <!-- ⑤ netfilter -->
    <rect class="nf" x="0" y="280" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="301">⑤ netfilter / iptables</text>
    <text class="l2" x="215" y="320">OUTPUT → POSTROUTING · nf_hook()</text>
    <line class="arr" x1="215" y1="332" x2="215" y2="350"/>

    <!-- ⑥ ip_output -->
    <rect class="kern" x="0" y="350" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="371">⑥ ip_output 分片</text>
    <text class="l2" x="215" y="390">根据 MTU 进行 IP 分片</text>
    <line class="arr" x1="215" y1="402" x2="215" y2="420"/>

    <!-- ⑦ tcpdump 抓包点 -->
    <rect class="tap" x="0" y="420" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="441">⑦ tcpdump 抓包点（TAP）</text>
    <text class="l2" x="215" y="460">在 netfilter 之后 — 被 DROP 的包无法抓到</text>
    <line class="arr" x1="215" y1="472" x2="215" y2="490"/>

    <!-- ⑧ dev_queue_xmit -->
    <rect class="kern" x="0" y="490" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="511">⑧ dev_queue_xmit</text>
    <text class="l2" x="215" y="530">tc/qdisc 流控 · pfifo_fast · HTB</text>
    <line class="arr" x1="215" y1="542" x2="215" y2="560"/>

    <!-- ⑨ txqueuelen -->
    <rect class="kern" x="0" y="560" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="581">⑨ txqueuelen 队列</text>
    <text class="l2" x="215" y="600">ifconfig txqueuelen · ip -s link 监控 dropped</text>
    <line class="arr" x1="215" y1="612" x2="215" y2="630"/>

    <!-- ⑩ TX Ring Buffer -->
    <rect class="hw" x="0" y="630" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="651">⑩ TX Ring Buffer</text>
    <text class="l2" x="215" y="670">ethtool -g/-G 调整大小</text>
    <line class="arr" x1="215" y1="682" x2="215" y2="700"/>

    <!-- ⑪ 驱动发送 -->
    <rect class="hw" x="0" y="700" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="721">⑪ 驱动发送</text>
    <text class="l2" x="215" y="740">NET_TX_SOFTIRQ · dev_weight 配额控制</text>
    <line class="arr" x1="215" y1="752" x2="215" y2="770"/>

    <!-- ⑫ 网卡发送 -->
    <rect class="hw" x="0" y="770" width="430" height="52" rx="8" filter="url(#ds)"/>
    <text class="l1" x="215" y="791">⑫ 网卡发送 · 硬中断完成</text>
    <text class="l2" x="215" y="810">释放克隆 skb · 等 ACK 释放原始 skb + 数据</text>

  </g>


  <!-- ================================================================ -->
  <!--                      中心备注                                     -->
  <!-- ================================================================ -->

  <!-- 备注 1: tcpdump 与 netfilter 位置关系 -->
  <rect class="note-box" x="530" y="540" width="440" height="82"/>
  <text x="750" y="562" text-anchor="middle" font-size="12" font-weight="600" fill="#37474F"
        >tcpdump 与 netfilter 的顺序差异</text>
  <line x1="640" y1="568" x2="860" y2="568" stroke="#CFD8DC" stroke-width="0.8"/>
  <text x="750" y="586" text-anchor="middle" font-size="11.5" fill="#455A64"
        >收包: tcpdump → netfilter（先抓后过滤）</text>
  <text x="750" y="605" text-anchor="middle" font-size="11.5" fill="#455A64"
        >发包: netfilter → tcpdump（先过滤后抓）</text>

  <!-- 连接线: RX tcpdump → 中心备注 -->
  <line x1="495" y1="576" x2="530" y2="576" stroke="#E53935" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- 连接线: TX tcpdump → 中心备注 -->
  <line x1="1005" y1="576" x2="970" y2="576" stroke="#E53935" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- 备注 2: 硬中断 CPU 亲和性 -->
  <rect class="note-box" x="540" y="336" width="420" height="58"/>
  <text x="750" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#37474F"
        >CPU 亲和性</text>
  <line x1="660" y1="364" x2="840" y2="364" stroke="#CFD8DC" stroke-width="0.8"/>
  <text x="750" y="383" text-anchor="middle" font-size="11.5" fill="#455A64"
        >硬中断在哪个 CPU 响应 → 软中断由同一 CPU 处理</text>

  <!-- 备注 3: skb 克隆机制 -->
  <rect class="note-box" x="540" y="220" width="420" height="72"/>
  <text x="750" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#37474F"
        >发包 skb 克隆机制</text>
  <line x1="655" y1="248" x2="845" y2="248" stroke="#CFD8DC" stroke-width="0.8"/>
  <text x="750" y="267" text-anchor="middle" font-size="11.5" fill="#455A64"
        >tcp_transmit_skb 克隆 skb，dataref 计数+1</text>
  <text x="750" y="284" text-anchor="middle" font-size="11.5" fill="#455A64"
        >克隆 skb 走协议栈，原始 skb 留在发送队列等 ACK</text>

  <!-- 备注 4: 发包 sy vs si -->
  <rect class="note-box" x="540" y="680" width="420" height="58"/>
  <text x="750" y="702" text-anchor="middle" font-size="12" font-weight="600" fill="#37474F"
        >发包 CPU 消耗类型</text>
  <line x1="650" y1="708" x2="850" y2="708" stroke="#CFD8DC" stroke-width="0.8"/>
  <text x="750" y="727" text-anchor="middle" font-size="11.5" fill="#455A64"
        >默认由系统调用完成（sy）· 超 dev_weight 配额后转软中断（si）</text>


  <!-- ================================================================ -->
  <!--                      图例                                         -->
  <!-- ================================================================ -->
  <g transform="translate(0,975)">
    <rect x="50" y="0" width="1400" height="46" rx="8" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="0.8"/>
    <text x="80" y="28" font-size="12" font-weight="600" fill="#546E7F">图例：</text>

    <!-- 硬件/驱动 -->
    <rect x="140" y="11" width="22" height="22" rx="4" class="hw"/>
    <text x="168" y="28" font-size="11.5" fill="#546E7F">硬件/驱动</text>

    <!-- 中断 -->
    <rect x="270" y="11" width="22" height="22" rx="4" class="irq"/>
    <text x="298" y="28" font-size="11.5" fill="#546E7F">中断</text>

    <!-- 内核 -->
    <rect x="370" y="11" width="22" height="22" rx="4" class="kern"/>
    <text x="398" y="28" font-size="11.5" fill="#546E7F">内核</text>

    <!-- 协议栈 -->
    <rect x="470" y="11" width="22" height="22" rx="4" class="proto"/>
    <text x="498" y="28" font-size="11.5" fill="#546E7F">协议栈</text>

    <!-- 应用层 -->
    <rect x="590" y="11" width="22" height="22" rx="4" class="app"/>
    <text x="618" y="28" font-size="11.5" fill="#546E7F">应用层</text>

    <!-- tcpdump -->
    <rect x="710" y="11" width="22" height="22" rx="4" class="tap"/>
    <text x="738" y="28" font-size="11.5" fill="#546E7F">tcpdump 抓包点</text>

    <!-- netfilter -->
    <rect x="880" y="11" width="22" height="22" rx="4" class="nf"/>
    <text x="908" y="28" font-size="11.5" fill="#546E7F">netfilter / iptables</text>

    <!-- softnet_stat 提示 -->
    <text x="1100" y="28" font-size="11" fill="#90A4AE"
          >监控: /proc/net/softnet_stat · ethtool -S · netstat -s · nstat</text>
  </g>

</svg>
